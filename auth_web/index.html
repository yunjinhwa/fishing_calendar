<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="color-scheme" content="light">
    <title>비밀번호 재설정 · Fishing Build</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/reset.mjs"></script>
  </head>
  <body>
    <main class="card" aria-labelledby="page-title">
      <p class="brand"><span class="brand-mark" aria-hidden="true">F</span> FISHING BUILD</p>
      <div class="lock-mark" aria-hidden="true">↻</div>
      <h1 id="page-title">새 비밀번호 설정</h1>
      <p class="intro">새 비밀번호로 다시 낚시 기록을 이어가세요.</p>
      <p id="status" class="status" role="status" aria-live="polite">재설정 링크를 확인하고 있습니다.</p>
      <p id="account" class="account" hidden></p>
      <p id="error" class="error-banner" role="alert" hidden></p>
      <button id="retry" class="secondary" type="button" hidden>링크 다시 확인</button>
      <a id="continue-auth" class="primary action-link" rel="noreferrer" referrerpolicy="no-referrer" hidden>인증 계속하기</a>

      <form id="reset-form" novalidate>
        <fieldset id="password-fields" disabled>
          <legend class="sr-only">새 비밀번호 입력</legend>
          <label for="password">새 비밀번호</label>
          <input id="password" name="new-password" type="password" autocomplete="new-password" required aria-describedby="password-hint password-error">
          <p id="password-hint" class="hint">8자 이상, 영문(대문자 또는 소문자)과 숫자를 포함해 주세요. 특수문자는 선택입니다.</p>
          <p id="password-error" class="field-error" hidden></p>

          <label for="confirmation">새 비밀번호 확인</label>
          <input id="confirmation" name="confirm-password" type="password" autocomplete="new-password" required aria-describedby="confirmation-error">
          <p id="confirmation-error" class="field-error" hidden></p>
          <button id="submit" class="primary" type="submit">비밀번호 변경</button>
        </fieldset>
      </form>

      <section id="success" class="success" aria-labelledby="success-title" hidden>
        <span class="success-mark" aria-hidden="true">✓</span>
        <h2 id="success-title">비밀번호가 변경되었습니다</h2>
        <p>Fishing Build 앱을 열어 새 비밀번호로 로그인해 주세요.</p>
        <p class="return-label">앱으로 돌아가 로그인</p>
      </section>
      <p class="footer">Fishing Build · 나의 낚시 기록</p>
      <noscript><p class="error-banner">비밀번호를 변경하려면 브라우저에서 자바스크립트를 허용해 주세요.</p></noscript>
    </main>
  </body>
</html>
